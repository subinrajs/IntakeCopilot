[project]
name = "intake"
version = "0.1.0"
description = "IntakeCopilot backend: requisition intake assistant for a fictional MRI/CT clinic (synthetic data only)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "psycopg[binary,pool]>=3.2",
    "pyyaml>=6.0",
    "openai>=3.24.0",
    "pypdfium2>=5.14.0",
    "pillow>=12.3.0",
    "rapidfuzz>=3.14.6",
    "reportlab>=5.0.1",
    "faker>=40.41.0",
    "rapidocr>=3",
    "onnxruntime>=1.30.0",
    "pgvector>=0.5.0",
    "python-multipart>=0.0.32",
    "pyjwt>=2.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["intake"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pypdfium2.*", "reportlab.*", "rapidocr.*", "faker.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs the local Postgres (make db-up migrate)"]
